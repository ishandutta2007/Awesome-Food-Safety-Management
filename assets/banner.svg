<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="glow-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #10b981; }
      
      /* Dynamic / Animated elements background */
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatFast {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-18px) rotate(-4deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; }
        50% { opacity: 0.7; }
        100% { opacity: 0.3; }
      }

      .floating-card-1 { animation: floatSlow 8s ease-in-out infinite; }
      .floating-card-2 { animation: floatFast 6s ease-in-out infinite; }
      .pulsing-bg { animation: pulseGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Animated Elements (Low Opacity behind content) -->
  <g class="pulsing-bg" opacity="0.4">
    <circle cx="1000" cy="80" r="140" fill="url(#glow-green)" filter="url(#glow)"/>
    <circle cx="150" cy="220" r="100" fill="#1e3a8a" filter="url(#glow)" opacity="0.5"/>
  </g>

  <!-- Decorative Dynamic Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Floating Decorative Cards in Background (Right side) -->
  <g class="floating-card-1" opacity="0.25">
    <rect x="850" y="50" width="280" height="90" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="870" y="70" width="120" height="12" rx="6" fill="#10b981"/>
    <rect x="870" y="94" width="200" height="8" rx="4" fill="#64748b"/>
    <rect x="870" y="110" width="160" height="8" rx="4" fill="#334155"/>
  </g>
  
  <g class="floating-card-2" opacity="0.2">
    <rect x="780" y="150" width="260" height="100" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="815" cy="185" r="16" fill="#3b82f6"/>
    <rect x="845" y="175" width="140" height="10" rx="5" fill="#93c5fd"/>
    <rect x="845" y="195" width="100" height="8" rx="4" fill="#475569"/>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent-grad)"/>

  <!-- FOREGROUND CONTENT (Guaranteed Clear & Readable) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 55)">
      <rect width="220" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="110" y="21" text-anchor="middle" class="badge-text">🛡️ FOOD SAFETY &amp; HACCP</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="140" class="title">Awesome Food Safety Management</text>

    <!-- Subtitle -->
    <text x="0" y="180" class="subtitle">Curated SaaS Platforms, Digital HACCP Tools &amp; Open-Source Compliance Software</text>

    <!-- Stats / Tags Row -->
    <g transform="translate(0, 215)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="62" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">📋 HACCP Plans</text>
      
      <!-- Tag 2 -->
      <rect x="135" y="0" width="150" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="210" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">🌡️ Temp Monitoring</text>

      <!-- Tag 3 -->
      <rect x="295" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="362" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">🔍 Audit &amp; Trace</text>

      <!-- Tag 4 -->
      <rect x="440" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="512" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1" font-weight="600">⚡ Open Source SaaS</text>
    </g>
  </g>
</svg>
